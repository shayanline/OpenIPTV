name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # So the engine and budget jobs can be run deliberately, rather than only as a side effect of
  # pushing something.
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository, so nothing here needs to be able to. Stated explicitly
# because the default for an older account is still read and write, and a token that can push is
# worth having only if something needs to push.
permissions:
  contents: read

# Actions are pinned to a commit rather than a tag, since a tag can be moved to point at different
# code and this workflow runs on every pull request from anybody. The tag is in the comment so a
# human can still read what version it is, and dependabot keeps the pins moving.
jobs:
  check:
    runs-on: ubuntu-latest
    # A backstop, not an estimate. Anything here that hangs rather than fails would otherwise
    # burn the six hour default, and a Chrome that dies mid run is a realistic way to hang.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc so the version lives in one place. The floor is 22.18 because that is
          # where the tooling this project uses settled, and vite.config.ts explains at length why
          # the tests run through Vitest rather than Node's own type stripping.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Lint, typecheck and unit tests, which is what `npm run check` is.
      - run: npm run check

      # Formatting is deliberately not a gate. Biome's formatter disagrees with this codebase in 71
      # files, almost all of it wanting to explode hand aligned argument lists and object literals
      # into something several lines longer, and the alignment here is a considered choice rather
      # than an accident. `npm run format:check` still exists for anyone who wants its opinion.
      - run: npm run build

      # The widget manifest has to be well formed XML or the Tizen CLI will not package it, and it
      # is a file nothing else parses, so nothing else would notice. It has been broken in this
      # repository before.
      #
      # libxml2-utils is installed because xmllint is not on the runner image and the images team
      # has twice declined to add it. Without this the step exits 127 and everything after it in the
      # job never runs, which is a green tick on a check that never happened.
      - name: Validate the widget manifest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxml2-utils
          xmllint --noout public/config.xml

      # The committed WebAssembly cannot be rebuilt here, because it needs Samsung's own Emscripten
      # fork, so the next best thing is proving that what is committed is what the recorded source
      # produced, and that the module and its worker still agree about the nineteen socket functions
      # the platform supplies. That mismatch is a failure this project has already paid for once.
      - name: The committed WebAssembly matches its source
        run: |
          shasum -a 256 -c wasm/checksums.txt
          node scripts/wasm-check.mjs

      # The televisions this is built for have no flex gap, so the stylesheet carries a
      # second set of spacing rules that no browser here ever uses. Without this they would
      # only be exercised on hardware nobody in CI has, which is to say never.
      - name: Spacing is the same with and without flex gap
        run: npm run tv:gap

  # ---------------------------------------------------------------------------------
  # The app, in the actual browser engines Samsung ships.
  #
  # A separate job because it downloads a couple of hundred megabytes of Chromium and
  # takes minutes rather than seconds, and because it is the one thing here that has to
  # run on Linux: the pinned old builds run there reliably and on a current macOS they
  # variously segfault, so a developer's laptop gets a best effort and CI gets the truth.
  #
  # Two engines, not seven, and engine-parity.mjs argues the case at length. The short
  # version is that the build targets the oldest and the stylesheet uses nothing newer,
  # so every year in between runs a strict superset of what the app asks for.
  # ---------------------------------------------------------------------------------
  engines:
    runs-on: ubuntu-latest
    # Longer, because a new engine is a couple of hundred megabytes to fetch.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Keyed on the resolved snapshot positions, so a new engine in platforms.json fetches
      # and everything else is already on disk.
      - name: Cache the pinned engines
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/openiptv-engines
          key: engines-${{ runner.os }}-${{ hashFiles('scripts/tv/platforms.json', 'scripts/tv/engines.lock.json') }}

      - run: npm ci
      - run: npm run build

      # Nothing throws on a 2020 engine, and the layout lands in the same place there as on
      # a 2025 one. This is what catches a builtin the old engine lacks, which the type
      # checker cannot see because the types describe the language rather than the browser,
      # and which esbuild does not polyfill because it lowers syntax and not methods.
      - name: Same behaviour on Chromium 69 and 120
        run: npm run tv:engines

  # ---------------------------------------------------------------------------------
  # Frame times on the weakest set Samsung has sold since 2020.
  #
  # One budget, on the floor, because everything newer is faster. Allowed to fail the
  # build: the throttle is a ratio between two machines and a CI runner is not the
  # machine it was calibrated against, so this is a regression alarm rather than an
  # absolute measurement. Read the numbers, do not merge on the tick alone.
  # ---------------------------------------------------------------------------------
  budget:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      # No playlist argument any more, and that is a fix rather than a tidy up.
      #
      # It used to be passed here because the simulator only knew the playlist that happened to
      # be in its Chrome profile, and a fresh runner has no profile: the app came up on its first
      # run screen, the readiness check refused to measure it, and this job exited 2 on every
      # single run. Being continue-on-error, the workflow stayed green and the budget was never
      # once evaluated in CI.
      #
      # The harness now owns the playlist. It fetches iptv-org's index, serves it locally and
      # asserts it into the profile's settings every run, so a fresh runner and a laptop measure
      # the same 12,732 channels and neither needs telling.
      # Written to the run summary as well as the log, because a job that is allowed to fail reports
      # itself green in the checks list: without this, the numbers nobody is supposed to merge on the
      # tick alone are buried in the log of a job that looks like it passed.
      - name: Within the floor profile's budget
        run: |
          set -o pipefail
          npm run tv:budget 2>&1 | tee /tmp/budget.txt
        continue-on-error: true

      - name: Put the numbers where they can be read
        if: always()
        run: |
          echo '## Performance budget, on the floor profile' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'A regression alarm rather than a verdict: the throttle is a ratio between two named' >> "$GITHUB_STEP_SUMMARY"
          echo 'machines and a shared runner is neither of them.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 /tmp/budget.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "the run produced nothing" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------
  # What a new dependency would bring with it.
  #
  # Four runtime dependencies and one of them is only used off the television, so this is
  # cheap and almost never fires. It is here because the thing being protected is a widget
  # that installs on somebody's television, where nothing can be patched in a hurry.
  # ---------------------------------------------------------------------------------
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          # A copyleft licence in something that ships inside the widget would be a licensing
          # problem rather than a security one, and THIRD-PARTY-NOTICES.md is what would need
          # rewriting, so it is worth being told at the point somebody proposes it.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0
