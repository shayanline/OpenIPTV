name: CI

# Pull requests always report required checks, including documentation changes.
on:
  push:
    branches: [master, main]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
  workflow_dispatch:

# Replace stale PR runs while keeping a run for each pushed commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run-checks: ${{ steps.paths.outputs.run-checks }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: paths
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('run-checks', true);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            if (pr.head.sha !== context.payload.pull_request.head.sha) {
              core.setOutput('run-checks', true);
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const prose = path => typeof path === 'string' &&
              (path.endsWith('.md') || path.startsWith('docs/') ||
               path.startsWith('.github/ISSUE_TEMPLATE/'));
            const runChecks = files.length !== pr.changed_files || files.some(file =>
              !prose(file.filename) ||
              ((file.status === 'renamed' || file.previous_filename !== undefined) &&
               !prose(file.previous_filename)));
            core.setOutput('run-checks', runChecks);

  check:
    needs: changes
    if: needs.changes.outputs.run-checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The build includes the typecheck. Formatting remains optional.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Validate the widget manifest
        run: python3 -c "from xml.dom.minidom import parse; parse('public/config.xml')"

      # CI checks the committed modules because rebuilding needs Samsung's toolchain.
      - name: The committed WebAssembly matches its source
        run: |
          shasum -a 256 -c wasm/checksums.txt
          npm run wasm:check

      - name: Spacing is the same with and without flex gap
        run: npm run tv:gap

  # Pinned browser engines run reliably on Linux.
  engines:
    needs: changes
    if: needs.changes.outputs.run-checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Reuse existing downloads when the engine matrix changes.
      - name: Cache the pinned engines
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/openiptv-engines
          key: engines-${{ runner.os }}-${{ hashFiles('scripts/tv/platforms.json', 'scripts/tv/engines.lock.json') }}
          restore-keys: engines-${{ runner.os }}-

      - run: npm ci
      - run: npm run build

      - name: Check browser engine compatibility
        run: npm run tv:engines

  # Shared runner timings are informational.
  budget:
    needs: changes
    if: needs.changes.outputs.run-checks == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Within the floor profile's budget
        run: |
          set -o pipefail
          npm run tv:budget 2>&1 | tee /tmp/budget.txt

      - name: Put the numbers where they can be read
        if: always()
        run: |
          {
            echo '## Performance budget, on the floor profile'
            echo ''
            echo 'Shared runner timings are informational. Inspect regressions before merging.'
            echo ''
            echo '```'
            tail -40 /tmp/budget.txt 2>/dev/null || echo "the run produced nothing"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dependencies:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.run-checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0
