name: Release

# Tags publish the widget, TV candidates and browser demo. Store submission stays manual.
on:
  push:
    tags: ["[0-9]*"]
  # Manual runs create an artifact and can optionally redeploy the browser demo.
  workflow_dispatch:
    inputs:
      dry-run:
        description: Skip publishing the browser demo
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment: release

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate the version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const limits = [255, 255, 65535];
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) ||
              version.split('.').some((part, index) => Number(part) > limits[index])) {
            throw new Error(`Samsung requires major.minor.micro bounded at 255.255.65535. Got ${version}.`);
          }
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== version) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match package.json version ${version}.`);
          }
          JS

      - name: Take the release notes from the changelog
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python3 - "$GITHUB_REF_NAME" <<'PY' > release-notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          found = re.search(rf"^## {re.escape(version)}\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not found or not found.group(1).strip():
              sys.exit(f"CHANGELOG.md has no entry for {version}. Write one before tagging.")
          print(found.group(1).strip())
          PY
          cat >> release-notes.md <<'MD'

          ---

          [Try it in a browser](https://shayanline.github.io/OpenIPTV), built from this tag.
          Read the README for the installation routes. `OpenIPTV.wgt.sha256` is the checksum of
          the attached widget.

          The attached widget is unsigned. The README covers installation through Apps2Samsung,
          TizenBrew and local signing with the Tizen CLI.

          The separate TV artifacts are experimental candidates. `OpenIPTV-webos.ipk` is the LG
          Developer Mode package. The Titan ZIP is a hosted app candidate. VIDAA and VIZIO ZIPs
          require partner integration, and the Vega ZIP is an SDK integration kit rather than a
          VPKG. These artifacts do not establish real TV compatibility or store approval.
          [Installation and publishing instructions](https://github.com/shayanline/OpenIPTV/blob/master/docs/tv-platforms.md)
          explain each route. `OpenIPTV-ports.json` identifies the versions and checksums.
          MD

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run tv:gap

      - name: Install the LG packaging tool
        run: |
          npm install --global @webos-tools/cli@3.2.6
          ares-config --profile tv

      - name: Package and exercise the TV release candidates
        run: |
          npm run ports:package
          npm run ports:smoke

      - name: Check the committed WebAssembly
        run: |
          shasum -a 256 -c wasm/checksums.txt
          npm run wasm:check

      # An unsigned WGT is a ZIP of the built widget root.
      - name: Package the unsigned widget
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/stamp-version.mjs dist/config.xml "$version"
          python3 -c "from xml.dom.minidom import parse; parse('dist/config.xml')"
          test -f dist/index.html
          mkdir -p build
          (cd dist && zip -qr ../build/OpenIPTV.wgt . -x author-signature.xml 'signature*.xml')
          cd build
          shasum -a 256 OpenIPTV.wgt > OpenIPTV.wgt.sha256

      - name: Upload the unsigned widget
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenIPTV
          path: |
            build/OpenIPTV.wgt
            build/OpenIPTV.wgt.sha256
          if-no-files-found: error

      - name: Upload the separate TV candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenIPTV-TV-ports
          path: build/ports/OpenIPTV-*
          if-no-files-found: error

      - name: Attach it to the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            build/OpenIPTV.wgt
            build/OpenIPTV.wgt.sha256
            build/ports/OpenIPTV-*
          fail_on_unmatched_files: true
          body_path: release-notes.md

  # Pages needs its own deployment environment. Rebuilding avoids an extra bundle transfer.
  pages:
    needs: release
    if: github.event_name == 'push' || !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      # The demo playlist must never enter the widget.
      - name: Add the demo playlist to Pages
        run: |
          mkdir -p dist/demo
          cp demo/nasa.m3u dist/demo/nasa.m3u

      # Relative asset URLs need no configure-pages step. Enable Pages once in repository settings.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
