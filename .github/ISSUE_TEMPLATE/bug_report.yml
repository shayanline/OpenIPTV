name: Something is not working
description: A channel that will not play, a key that does nothing, anything the app gets wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Open Settings > About > Diagnostics for device and playback details.
        Remove private addresses, credentials and pairing codes from text and screenshots.
        Report security problems through [private vulnerability reporting](https://github.com/shayanline/OpenIPTV/security/advisories/new).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what the screen actually showed.
      placeholder: |
        I pressed down at the picture to change channel and the banner named the next channel, but
        the picture stayed on the previous one until I pressed OK.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OpenIPTV version
      description: Open Settings > About. For a source build, include the commit if known.
      placeholder: "1.10.0"
    validations:
      required: true

  - type: input
    id: television
    attributes:
      label: Which television
      description: Give the TV model and year, or the browser and version.
      placeholder: Samsung 2021 QN90A, or "desktop Chrome 141"
    validations:
      required: true

  - type: input
    id: tizen
    attributes:
      label: Tizen version
      description: Open Settings > About > Diagnostics. Leave blank if unavailable.
      placeholder: "7.0"

  - type: textarea
    id: diagnostics
    attributes:
      label: The Diagnostics screen
      description: Paste the details or attach a screenshot after removing private information.

  - type: dropdown
    id: compatibility
    attributes:
      label: Is compatibility mode on?
      description: Open Settings > Playback. It is off unless you turned it on.
      options:
        - "Off, the default"
        - "On"
        - "I do not know"

  - type: textarea
    id: playlist
    attributes:
      label: The playlist, if it is involved
      description: >
        Say whether you use M3U or Xtream, how many channels it contains and which stream format
        fails, if known. Do not include private addresses, usernames, passwords or tokens.

  - type: checkboxes
    id: checked
    attributes:
      label: Before opening this
      options:
        - label: I read the troubleshooting section in the README.
        - label: This is not a security problem. I will report security problems privately.
          required: true
