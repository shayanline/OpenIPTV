version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  # Keep the workflow action pins current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
