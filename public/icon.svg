<?xml version="1.0" encoding="UTF-8"?>
<!--
  The app mark, and the master every other size is rendered from. Run `npm run icon` after
  changing anything here, which redraws public/icon.png, the icon config.xml points the set at.

  No width or height, only a viewBox, so the mark fills whatever box it is given: a browser
  tab at 16px, a tile on the TV's Apps row, a store image at 512px. That is also what lets
  the render ask for an exact pixel size rather than scaling a bitmap afterwards.

  The mark is deliberately plain. It is read across a room, at a size where a thin outline
  or a gradient inside the glyph turns to grey mush: a single flat white television on a
  full bleed gradient, and nothing else.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="SimpleIPTV">
  <defs>
    <!-- A squircle rather than a rounded rectangle, which is the shape One UI puts app
         icons in, and the corners stay transparent so the set can mask its own way. -->
    <clipPath id="squircle">
      <path d="M 256,0 C 51.2,0 0,51.2 0,256 C 0,460.8 51.2,512 256,512
               C 460.8,512 512,460.8 512,256 C 512,51.2 460.8,0 256,0 Z" />
    </clipPath>
    <linearGradient id="mark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#53D1B8" />
      <stop offset="100%" stop-color="#5E64D2" />
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#mark-bg)" />

    <!-- Drawn on a 20 grid and scaled up, so the glyph keeps its proportions whatever
         size the whole mark is rendered at. -->
    <g transform="translate(256 256) scale(20) translate(-10 -10)"
       fill="#FCFCFC" fill-rule="evenodd" clip-rule="evenodd">
      <path d="M4.25 9v5a2 2 0 0 0 2 2h7.5a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-7.5a2 2 0 0 0-2 2m-1 0v5a3 3 0 0 0 3 3h7.5a3 3 0 0 0 3-3V9a3 3 0 0 0-3-3h-7.5a3 3 0 0 0-3 3" />
      <path d="M11.5 11.5L9 13v-3z" />
      <path d="M12 11.5a.5.5 0 0 1-.243.429l-2.5 1.5A.5.5 0 0 1 8.5 13v-3a.5.5 0 0 1 .757-.429l2.5 1.5A.5.5 0 0 1 12 11.5m-2.5-.617v1.234l1.028-.617zm3.062-7.773a.5.5 0 0 1 .078.702l-2 2.5a.5.5 0 1 1-.78-.624l2-2.5a.5.5 0 0 1 .702-.078" />
      <path d="M6.938 3.11a.5.5 0 0 1 .702.078l2 2.5a.5.5 0 1 1-.78.624l-2-2.5a.5.5 0 0 1 .078-.702" />
    </g>
  </g>
</svg>
